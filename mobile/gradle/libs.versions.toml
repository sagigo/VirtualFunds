[versions]
agp = "9.2.0"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.04.01"
jetbrainsKotlinJvm = "2.2.10"
# KSP version must match the Kotlin version: {kotlinVersion}-{kspBuildNumber}.
# https://github.com/google/ksp/releases — search for your exact Kotlin version prefix.
ksp = "2.2.10-2.0.2"
hilt = "2.59.2"
hiltLifecycleViewmodelCompose = "1.3.0"
supabase = "3.1.4"
ktor = "3.1.2"
kotlinxCoroutines = "1.10.2"
navigationCompose = "2.9.8"
securityCrypto = "1.1.0"
kotlinxSerializationJson = "1.7.3"
lifecycle = "2.10.0"
kotest = "5.9.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Material icons (core set) — small bundle of common system icons (Add, MoreVert, ExitToApp, …).
# We intentionally avoid material-icons-extended (~30MB) and stick to the core set for now.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# Hilt — Google's compile-time DI framework for Android (built on Dagger).
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# hilt-lifecycle-viewmodel-compose lets Compose screens obtain @HiltViewModels via hiltViewModel().
# (As of androidx.hilt 1.3.0 the function moved here from the older hilt-navigation-compose
# artifact, which is now deprecated for this purpose.)
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewmodelCompose" }
# Supabase Kotlin SDK — uses a BOM so all sub-artifacts stay version-aligned.
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
# OkHttp is the HTTP engine supabase-kt uses on Android (Ktor is its transport layer).
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
# Coroutines — async/await and Flow support.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# Navigation Compose — type-safe screen routing (mobile/CLAUDE.md §Navigation).
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# EncryptedSharedPreferences — stores the Supabase session token encrypted via Android Keystore.
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
# kotlinx.serialization JSON — runtime serializer for UserSession (the type is already @Serializable
# upstream in supabase-kt; we only need the Json runtime to encode/decode it).
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# lifecycle-viewmodel-compose — provides collectAsStateWithLifecycle() so Composables can collect
# StateFlows in a lifecycle-aware way (stops collecting when the screen is in the background).
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# Kotest — test framework for :domain unit tests (behaviour-spec style, rich matchers).
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
# Hilt plugin wires up Dagger/Hilt code generation into the Android build.
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# KSP (Kotlin Symbol Processing) — Hilt's modern compile-time code generator.
# Faster than the older KAPT approach and required for Kotlin 2.x.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# kotlin-serialization is the compiler plugin that turns @Serializable data classes into
# generated KSerializer implementations at compile time. Required by supabase-kt's Postgrest
# request bodies (RPC parameters, table inserts) and for our DTOs in :data.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

